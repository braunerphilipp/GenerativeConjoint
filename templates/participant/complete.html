<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  {% if redirect_url %}
  <meta http-equiv="refresh" content="3;url={{ redirect_url }}">
  {% endif %}
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <div class="card shadow-sm mx-auto" style="max-width: 480px">
    <div class="card-body py-5">
      <div class="display-1 text-success mb-3">&#10003;</div>
      <h1 class="h4 mb-2">Thank you!</h1>
      <p class="text-muted mb-0">
        You have completed the preference task for
        <strong>{{ survey.title }}</strong>.
      </p>
      {% if redirect_url %}
      <p class="text-muted mt-3 small">
        You will be redirected automatically in a moment&hellip;
      </p>
      <a href="{{ redirect_url }}" class="btn btn-primary mt-2">Continue</a>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
