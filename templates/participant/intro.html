<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ survey.title }}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { background: #f8f9fa; }
    .intro-header {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: .75rem 0;
    }
    .intro-body {
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div class="intro-header">
  <div class="container">
    <span class="fw-semibold">{{ survey.title }}</span>
  </div>
</div>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">

      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <p class="intro-body text-dark mb-5">{{ survey.intro_text }}</p>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="consent-checkbox"
                     onchange="toggleStart()">
              <label class="form-check-label" for="consent-checkbox">
                {{ consent_text }}
              </label>
            </div>
          </div>

          <div class="text-center">
            <a id="start-btn"
               href="{{ url_for('participant_task', public_id=survey.public_id, task_index=0) }}"
               class="btn btn-primary btn-lg px-5 disabled"
               aria-disabled="true">
              Start <i class="bi bi-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleStart() {
  const btn = document.getElementById('start-btn');
  const checked = document.getElementById('consent-checkbox').checked;
  if (checked) {
    btn.classList.remove('disabled');
    btn.removeAttribute('aria-disabled');
  } else {
    btn.classList.add('disabled');
    btn.setAttribute('aria-disabled', 'true');
  }
}
</script>
</body>
</html>
