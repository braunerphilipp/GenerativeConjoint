<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missing Participant Key</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <div class="card shadow-sm mx-auto" style="max-width: 480px">
    <div class="card-body py-5">
      <h1 class="h5 text-danger mb-3">Missing Participant Key</h1>
      <p class="text-muted">
        This survey requires a participant key to be passed as a URL parameter
        (<code>?key=YOUR_KEY</code>).
        Please access this survey through your study's main survey link.
      </p>
    </div>
  </div>
</div>
</body>
</html>
